[build-system]
# Pure Python: the native kernels moved to relic-core, so nothing here compiles
# and setuptools is the whole build surface.
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "pocketllm"
version = "0.1.2.dev0"
description = "Inference engine for large language models on a single accelerator, edge and mobile"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "lvyufeng" }
]
keywords = [
    "llm",
    "inference",
    "cuda",
    "gguf",
    "quantization",
    "edge",
    "mobile",
    "single-card",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0,<2.7",
    # The shared operator library (CUDA kernels + the CPU host ops), which is
    # where the vendored GGML tables and every native kernel now live. Not on
    # PyPI yet; install it from its checkout first:
    #   pip install -e ../relic-core --no-build-isolation
    "relic-core",
    "transformers>=4.40",
    "safetensors>=0.4",
    "tqdm>=4.66",
    "setuptools>=68",
]

[project.optional-dependencies]
triton = ["triton>=2.0"]
minimal = []  # kept for callers that pinned it; the base install is already minimal
all = ["pocketllm[triton]"]

[project.scripts]
pocketllm = "pocketllm.cli:main"

[project.urls]
Homepage = "https://github.com/lvyufeng/PocketLLM"
Documentation = "https://lvyufeng.github.io/PocketLLM/"
Repository = "https://github.com/lvyufeng/PocketLLM"
Issues = "https://github.com/lvyufeng/PocketLLM/issues"
Changelog = "https://github.com/lvyufeng/PocketLLM/blob/master/CHANGELOG.md"

# Packages are resolved in setup.py via find_namespace_packages() so the list
# cannot drift from the tree the way a hand-maintained literal did.
