      - Phase 3.2 completion summary: archive/phase2-phase3/phase3_2_completion_summary.md
      - Phase 3.3 implementation plan: archive/phase2-phase3/phase3_3_implementation_plan.md
      - Phase 3.3 completion summary: archive/phase2-phase3/phase3_3_completion_summary.md
      - Phase 3.4 completion summary: archive/phase2-phase3/phase3_4_completion_summary.md
      - Phase 3.5 auto-TP results: archive/phase2-phase3/phase3_5_auto_tp_results.md
