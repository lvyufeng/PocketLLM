name: Publish to PyPI

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Build package
      run: python -m build --sdist --no-isolation

    - name: Check package
      run: twine check dist/*

    - name: Publish to Test PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        twine upload --repository testpypi dist/* --verbose

    - name: Wait for Test PyPI to process
      run: sleep 60

    - name: Test installation from Test PyPI
      run: |
        python -m venv test-env
        source test-env/bin/activate
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            pocketllm --no-build-isolation || echo "Installation test failed, but continuing"
        python -c "import pocketllm; print(f'Version: {pocketllm.__version__}')" || echo "Import test failed"
        deactivate

    - name: Publish to Production PyPI
      # Only run if explicitly approved
      if: github.event.inputs.publish_production == 'yes'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/* --verbose
