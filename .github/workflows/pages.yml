name: Publish documentation

# The published site is the `docs/` tree itself: mkdocs.yml points `docs_dir` at it,
# so no content is copied into place and there is nothing that can drift between the
# repository view and the site.
#
# `--strict` promotes every MkDocs warning to an error. That is deliberate: it makes
# this build the repository's link checker, so a document that links to a renamed file
# fails here instead of shipping a 404.
#
# `hooks/` and the llms.txt generator are inputs to the build, not just to the site: the
# `on_config` hook in hooks/llms_txt_staleness.py compares docs/llms.txt against the nav, and
# scripts/gen_llms_txt.py defines what it should contain. A change to either can make that file
# stale, so a push touching only them still has to build -- otherwise the guard has a blind spot
# exactly where it is most likely to be needed.
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'hooks/**'
      - 'scripts/gen_llms_txt.py'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Read the repository for the build, and let the deploy job mint a Pages token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run that arrives while another is publishing queues
# behind it instead of cancelling it, because the deploy step is not restartable.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install the site toolchain
        # The only dependency source for the site, here and locally.
        run: pip install -r requirements-docs.txt

      - name: Build the site
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
